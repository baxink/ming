<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大明新闻季报 | The Ming Post</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="newspaper">
  <div class="newspaper-inner">

    <header class="masthead">
      <div class="masthead-kicker">明朝历史新闻纸</div>
      <h1 class="masthead-title">大明新闻季报</h1>
      <div class="masthead-subtitle">The Ming Post</div>
    </header>

    <div class="issue-line">
      <span class="reign-date" id="mingDate">洪武元年正月</span>
      <span id="periodLabel">洪武元年第一季度</span>
      <span id="emperorName">太祖朱元璋</span>
      <span class="real-date" id="realDate">2026年05月15日</span>
    </div>

    <div class="period-line">
      <span id="periodRange">洪武元年1月—3月</span>
      <span id="issueNumber">第 1 期</span>
    </div>

    <hr class="top-rule">
    <hr class="bottom-rule">

    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p style="font-family: serif; color: #666;">正在排版本季度新闻…</p>
      </div>
    </div>

    <footer class="footer">
      <div class="motto">"以史为鉴，可以知兴替"</div>
      <div class="note" id="footerNote">
        本报时间比例：1真实日 = 1明朝季度 | 每期覆盖3个月，为一个季度
      </div>
    </footer>

  </div>
</div>

<script src="config.js"></script>
<script src="js/news.js"></script>
</body>
</html>
