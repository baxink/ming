<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>大明新闻月报 | The Ming Post</title>
<style>
/* ==========================================
   大明新闻月报 — Washington Post 风格样式
   ========================================== */

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap');

:root {
  --serif: 'Noto Serif SC', 'Songti SC', 'SimSun', 'Times New Roman', serif;
  --sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --black: #111111;
  --dark: #1a1a1a;
  --gray: #666666;
  --light-gray: #999999;
  --border: #333333;
  --rule: #1a1a1a;
  --paper: #f7f3ea;
  --ink-soft: #3a332d;
  --max-width: 1180px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--serif);
  color: var(--black);
  background: #e5e0d8;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

.newspaper {
  max-width: var(--max-width);
  margin: 28px auto;
  background: var(--paper);
  box-shadow: 0 12px 32px rgba(0,0,0,0.14);
}

.newspaper-inner {
  padding: 28px 38px 44px;
}

.masthead {
  text-align: center;
  border-bottom: 3px double var(--border);
  padding-bottom: 14px;
}

.masthead-kicker {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--gray);
  text-transform: uppercase;
  margin-bottom: 4px;
}

.masthead-title {
  font-size: 58px;
  font-weight: 900;
  letter-spacing: 4px;
  line-height: 1;
}

.masthead-subtitle {
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: 5px;
  color: var(--gray);
  text-transform: uppercase;
  margin-top: 4px;
}

.issue-line,
.period-line {
  display: grid;
  grid-template-columns: 1.4fr 1.2fr 1fr 1fr;
  gap: 12px;
  align-items: center;
  font-family: var(--sans);
  font-size: 12px;
  color: var(--gray);
  letter-spacing: 0.4px;
}

.issue-line {
  padding: 9px 0 8px;
  border-bottom: 1px solid var(--rule);
}

.period-line {
  padding: 7px 0 4px;
}

.reign-date {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 700;
  color: var(--black);
}

.real-date,
#issueNumber {
  text-align: right;
}

.top-rule {
  border: none;
  border-top: 5px solid var(--rule);
  margin: 4px 0 3px;
}

.bottom-rule {
  border: none;
  border-top: 2px solid var(--rule);
  margin: 0 0 14px;
}

.section-rule {
  border: none;
  border-top: 1px solid #b9b1a7;
  margin: 18px 0 16px;
}

.lead-wrap {
  margin-top: 4px;
}

.lead-story .eyebrow {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 1.3px;
  color: var(--gray);
  margin-bottom: 6px;
}

.lead-story .headline {
  font-size: 38px;
  line-height: 1.08;
  font-weight: 900;
  letter-spacing: 0.3px;
}

.lead-story .subhead {
  font-size: 17px;
  color: var(--ink-soft);
  margin-top: 8px;
  max-width: 86%;
}

.meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-top: 10px;
  font-family: var(--sans);
  font-size: 11px;
  color: var(--gray);
  text-transform: uppercase;
}

.meta-row.compact {
  margin-top: 6px;
}

.dateline {
  font-family: var(--serif);
  font-weight: 700;
  color: var(--dark);
}

.source-date {
  border-left: 1px solid #bbb1a2;
  padding-left: 10px;
}

.lead-story .body {
  margin-top: 12px;
  font-size: 15px;
  color: var(--ink-soft);
  text-align: justify;
}

.news-grid {
  display: grid;
  grid-template-columns: 1fr 1px 1fr 1px 1fr;
  gap: 0;
}

.news-col {
  padding: 0 14px;
}

.news-col:first-child { padding-left: 0; }
.news-col:last-child { padding-right: 0; }

.col-divider {
  background: #bfb5a7;
  width: 1px;
}

.section-block + .section-block {
  margin-top: 16px;
}

.section-header {
  font-size: 17px;
  font-weight: 900;
  text-align: center;
  letter-spacing: 2px;
  padding: 7px 0;
  margin-bottom: 10px;
  border-top: 2px solid var(--rule);
  border-bottom: 2px solid var(--rule);
}

.section-header.first {
  margin-top: 0;
}

.article {
  border-bottom: 1px solid #dad1c6;
  padding-bottom: 12px;
  margin-bottom: 12px;
}

.article:last-child {
  margin-bottom: 0;
}

.article .headline {
  font-size: 20px;
  line-height: 1.2;
  font-weight: 700;
}

.article .subhead {
  margin-top: 5px;
  font-size: 13px;
  color: var(--ink-soft);
}

.article .byline {
  margin-top: 5px;
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.2px;
  color: var(--gray);
  text-transform: uppercase;
}

.article .body {
  margin-top: 6px;
  font-size: 13px;
  color: var(--ink-soft);
  text-align: justify;
}

.article-empty {
  color: var(--light-gray);
  font-style: italic;
  text-align: center;
  padding: 24px 0;
}

.severity-badge {
  display: inline-block;
  vertical-align: middle;
  margin-left: 8px;
  padding: 1px 7px;
  border: 1px solid;
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.severity-badge.critical {
  color: #9c0000;
  border-color: #9c0000;
}

.severity-badge.major {
  color: #8a4d00;
  border-color: #8a4d00;
}

.footer {
  margin-top: 30px;
  padding-top: 16px;
  border-top: 2px solid var(--rule);
  text-align: center;
  font-family: var(--sans);
  font-size: 11px;
  color: var(--light-gray);
}

.footer .motto {
  font-family: var(--serif);
  font-size: 14px;
  font-style: italic;
  color: var(--gray);
}

.footer .note {
  margin-top: 4px;
}

.empty-state {
  text-align: center;
  padding: 44px 20px;
  color: var(--light-gray);
}

.empty-state .icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.loading {
  text-align: center;
  padding: 60px 20px;
}

.loading-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid #ddd;
  border-top-color: var(--black);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 980px) {
  .issue-line,
  .period-line {
    grid-template-columns: 1fr 1fr;
  }

  .real-date,
  #issueNumber {
    text-align: left;
  }

  .news-grid {
    grid-template-columns: 1fr;
  }

  .col-divider {
    display: none;
  }

  .news-col {
    padding: 0;
    margin-bottom: 16px;
  }
}

@media (max-width: 640px) {
  .newspaper {
    margin: 10px auto;
  }

  .newspaper-inner {
    padding: 16px 16px 26px;
  }

  .masthead-title {
    font-size: 34px;
    letter-spacing: 2px;
  }

  .lead-story .headline {
    font-size: 28px;
  }

  .lead-story .subhead {
    max-width: none;
    font-size: 15px;
  }

  .issue-line,
  .period-line {
    grid-template-columns: 1fr;
    gap: 4px;
  }
}

@media print {
  body {
    background: white;
  }

  .newspaper {
    box-shadow: none;
    margin: 0;
    max-width: none;
  }

  .newspaper-inner {
    padding: 0;
  }
}

</style>
</head>

/**
 * 大明新闻月报 — 华盛顿邮报风格渲染引擎
 */

const SECTION_ORDER = ['朝政要闻', '边关军事', '经济民生', '科举文教', '灾异志', '人事任免'];

function escapeHTML(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function createArticleHTML(article, isLead = false) {
  const severityClass = article.severity || '';
  const badgeHTML = severityClass
    ? `<span class="severity-badge ${severityClass}">${severityClass === 'critical' ? '头条' : '要闻'}</span>`
    : '';
  const sourceDate = article.source_date ? `<span class="source-date">${escapeHTML(article.source_date)}</span>` : '';

  if (isLead) {
    return `
      <article class="lead-story" data-id="${escapeHTML(article.id)}">
        <div class="eyebrow">LEAD STORY</div>
        <h2 class="headline">${escapeHTML(article.headline)}${badgeHTML}</h2>
        ${article.subhead ? `<div class="subhead">${escapeHTML(article.subhead)}</div>` : ''}
        <div class="meta-row">
          <span class="dateline">${escapeHTML(article.dateline || '')}</span>
          ${article.byline ? `<span class="byline">${escapeHTML(article.byline)}</span>` : ''}
          ${sourceDate}
        </div>
        <div class="body">${escapeHTML(article.body || '')}</div>
      </article>`;
  }

  return `
    <article class="article" data-id="${escapeHTML(article.id)}">
      <h3 class="headline">${escapeHTML(article.headline)}${badgeHTML}</h3>
      ${article.subhead ? `<div class="subhead">${escapeHTML(article.subhead)}</div>` : ''}
      <div class="meta-row compact">
        <span class="dateline">${escapeHTML(article.dateline || '')}</span>
        ${sourceDate}
      </div>
      ${article.byline ? `<div class="byline">${escapeHTML(article.byline)}</div>` : ''}
      ${article.body ? `<div class="body">${escapeHTML(article.body)}</div>` : ''}
    </article>`;
}

function renderSection(name, articles, first = false) {
  if (!articles || articles.length === 0) return '';
  const items = articles.map(article => createArticleHTML(article, false)).join('');
  return `
    <section class="section-block">
      <div class="section-header ${first ? 'first' : ''}">${escapeHTML(name)}</div>
      ${items}
    </section>`;
}

function distributeSections(sectionEntries) {
  const columns = [[], [], []];
  const counts = [0, 0, 0];
  for (const entry of sectionEntries) {
    let target = 0;
    if (counts[1] < counts[target]) target = 1;
    if (counts[2] < counts[target]) target = 2;
    columns[target].push(entry);
    counts[target] += entry.articles.length;
  }
  return columns;
}

function renderNewspaper(issue) {
  const content = document.getElementById('content');
  if (!content) return;

  const d = issue.date || {};
  const period = issue.period || {};

  document.getElementById('mingDate').textContent = `${d.ming_reign || ''}${d.ming_year || ''}年${d.ming_month || ''}月 · ${d.season || ''}季`;
  document.getElementById('emperorName').textContent = d.emperor || '';
  document.getElementById('realDate').textContent = d.real_date || '';
  document.getElementById('periodLabel').textContent = period.label || '';
  document.getElementById('periodRange').textContent = `${period.start_label || ''}—${period.end_label || ''}`;
  document.getElementById('issueNumber').textContent = period.issue_number ? `第 ${period.issue_number} 期` : '';
  document.title = `大明新闻月报 — ${period.label || `${d.ming_reign || ''}${d.ming_year || ''}年`}`;

  if (issue.editorial_note) {
    document.getElementById('footerNote').textContent = issue.editorial_note;
  }

  const lead = issue.lead || null;
  const sections = issue.sections || {};
  const sectionEntries = SECTION_ORDER
    .filter(name => Array.isArray(sections[name]) && sections[name].length > 0)
    .map(name => ({ name, articles: sections[name] }));

  if (!lead && sectionEntries.length === 0) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="icon">📰</div>
        <p>本季度暂无可编排的历史记录</p>
        <p style="font-size:12px;margin-top:8px;color:#999;">
          当前期次：${escapeHTML(period.label || '')}<br>
          时间范围：${escapeHTML(period.start_label || '')}—${escapeHTML(period.end_label || '')}
        </p>
      </div>`;
    return;
  }

  let html = '';
  if (lead) {
    html += `<section class="lead-wrap">${createArticleHTML(lead, true)}</section>`;
    html += '<hr class="section-rule">';
  }

  const columns = distributeSections(sectionEntries);
  html += '<div class="news-grid">';
  columns.forEach((columnSections, index) => {
    if (index > 0) html += '<div class="col-divider"></div>';
    html += '<div class="news-col">';
    if (columnSections.length === 0) {
      html += '<div class="article article-empty">（本栏无文章）</div>';
    } else {
      html += columnSections.map((entry, idx) => renderSection(entry.name, entry.articles, idx === 0)).join('');
    }
    html += '</div>';
  });
  html += '</div>';

  content.innerHTML = html;
}

function configuredIssueUrls() {
  const config = window.MING_POST_CONFIG || {};
  const apiBaseUrl = String(config.apiBaseUrl || '').replace(/\/+$/, '');
  const urls = [];

  if (apiBaseUrl) {
    urls.push(`${apiBaseUrl}/api/issue/latest`);
  }

  urls.push('data/issue.json');
  return urls;
}

function fetchFirstAvailable(urls) {
  return urls.reduce((chain, url) => {
    return chain.catch(() => fetch(url).then(res => {
      if (!res.ok) throw new Error(`${url} returned ${res.status}`);
      return res.json();
    }));
  }, Promise.reject(new Error('No issue source configured')));
}

function loadIssue(urls) {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="loading">
      <div class="loading-spinner"></div>
      <p style="font-family: serif; color: #666;">正在排版本季度新闻…</p>
    </div>`;

  fetchFirstAvailable(urls)
    .then(issue => {
      renderNewspaper(issue);
    })
    .catch(err => {
      content.innerHTML = `
        <div class="empty-state">
          <div class="icon">📰</div>
          <p>报纸数据加载失败</p>
          <p style="font-size:12px;margin-top:8px;color:#999;">
            请先运行 <code>python generate_news.py</code> 生成今日报纸<br>
            ${escapeHTML(err.message)}
          </p>
        </div>`;
    });
}

document.addEventListener('DOMContentLoaded', () => {
  if (window.__MING_ISSUE__) {
    renderNewspaper(window.__MING_ISSUE__);
  } else {
    loadIssue(configuredIssueUrls());
  }
});
